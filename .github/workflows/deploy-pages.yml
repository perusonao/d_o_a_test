name: Deploy to GitHub Pages

# Flutter Web をビルドして GitHub Pages に公開するワークフロー。
# プロジェクトページ（https://<user>.github.io/d_o_a_test/）で配信するため
# base-href に /d_o_a_test/ を指定する。

on:
  push:
    branches:
      - claude/dead-or-alive-prototype-1jzks6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を抑止（最新のデプロイのみ有効に）。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /d_o_a_test/ --no-web-resources-cdn

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
