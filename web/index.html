<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="情報と介入で9人の運命を裁く対戦ゲーム『9人の審判 / Nine Verdicts』">
  <meta name="theme-color" content="#0B0B10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nine Verdicts">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>9人の審判 / Nine Verdicts</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // The /showcase hidden route gets its own manifest so "Add to Home
    // Screen" launches straight back into it instead of the regular game's
    // start_url. Runs before flutter_bootstrap.js so Safari sees the right
    // manifest link as soon as the page is shared.
    //
    // The admin dashboard previously had the same treatment (a dedicated
    // web/admin/ subdirectory + manifest_admin.json), but that separate
    // PWA-install path proved unreliable for testers in practice — admins
    // now reach the dashboard via a long-press on the title screen's beta
    // badge instead (see mode_select_screen.dart's _BetaBadge), which needs
    // no special manifest handling at all.
    (function () {
      var manifestForHash = function () {
        var hash = window.location.hash || '';
        if (hash.indexOf('#/showcase') === 0) return 'manifest_showcase.json';
        return 'manifest.json';
      };
      var updateManifestLink = function () {
        var link = document.querySelector('link[rel="manifest"]');
        if (link) link.setAttribute('href', manifestForHash());
      };
      updateManifestLink();
      window.addEventListener('hashchange', updateManifestLink);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
